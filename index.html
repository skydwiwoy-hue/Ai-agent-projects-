<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Video Clipper Pro</title>
    
    <!-- Panggil FFmpeg v0.12+ (UMD) & Util dari CDN yang tepat -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
    
    <style>
        :root {
            --bg-body: #090d16;
            --card-bg: #131927;
            --input-bg: #0b0f19;
            --accent: #3b82f6;
            --accent-green: #10b981;
            --border: #212b3d;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 16px 10px; }
        .container { max-width: 600px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .header p { color: var(--text-sub); font-size: 0.85rem; margin-top: 4px; }

        .panel { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }
        .form-input:focus { border-color: var(--accent); }

        .btn-generate { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .btn-generate:hover { background: #2563eb; }
        .btn-generate:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
        
        /* CARD KLIP */
        .clip-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .clip-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .badge-id { background: var(--accent); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-time { background: var(--accent-green); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }

        .label-title { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-top: 10px; margin-bottom: 6px; display: block; }
        .box-content { background: var(--input-bg); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; color: #e2e8f0; border: 1px solid var(--border); white-space: pre-line; }
        
        .headline-text { color: #f59e0b; font-weight: 700; border-left: 3px solid #f59e0b; }

        .btn-copy { width: 100%; padding: 9px; background: #1e293b; color: #94a3b8; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 6px; transition: 0.2s; }
        .btn-copy:hover { background: #334155; color: #fff; }

        .btn-download { width: 100%; padding: 12px; background: var(--accent-green); color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-download:hover { background: #059669; }
        .btn-download:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }

        .transcript-container { background: #111827; border: 1px dashed #374151; padding: 10px; border-radius: 8px; font-size: 0.8rem; color: #9ca3af; margin-bottom: 16px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 Smart Video Clipper Pro</h1>
        <p>Proses Auto Split 5 Klip (>30s) atau Single Clip (≤30s) + Transkrip</p>
    </div>

    <div class="panel">
        <div class="form-group">
            <label>🎥 1. Link Video YouTube (Panjang / Pendek):</label>
            <input type="text" id="ytUrlInput" class="form-input" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <div class="form-group">
            <label>📜 2. Link Transkrip YouTube / Subtitle URL:</label>
            <input type="text" id="transcriptUrlInput" class="form-input" placeholder="https://youtube-transcript.ai/v=...">
        </div>

        <div class="form-group">
            <label>📁 Atau Upload File MP4 Lokal:</label>
            <input type="file" id="videoFileInput" accept="video/mp4,video/*" class="form-input">
        </div>
    </div>

    <button id="processBtn" class="btn-generate">⚡ PROSES KLIP & TRANSKRIP</button>

    <div id="resultArea"></div>
</div>

<script src="script.js"></script>
</body>
</html>
